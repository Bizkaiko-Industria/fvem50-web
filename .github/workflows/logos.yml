# Busca los logos de las empresas en sus webs y deja los resultados en esta misma rama para revisarlos.
# Se lanza al subir cambios a la rama «cambio/logos-busqueda» (o a mano desde la pestaña Actions).
# No publica nada: los logos solo pasan a la web después de revisarlos.
name: Buscar logos de empresas

on:
  push:
    branches: [cambio/logos-busqueda, cambio/logos-reintento]
    paths: [herramientas/buscar_logos.py, .github/workflows/logos.yml, herramientas/lanzar_busqueda.txt, herramientas/logos_reintentar.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logos
  cancel-in-progress: true

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 > /dev/null
          pip install -q requests beautifulsoup4 lxml pillow cairosvg
      - name: Buscar logos
        run: python herramientas/buscar_logos.py
      - name: Guardar resultados en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herramientas/logos_candidatos* herramientas/logos_resultado*.json
          git commit -m "Resultados de la búsqueda automática de logos (pendientes de revisión)" || echo "Sin cambios"
          git push
